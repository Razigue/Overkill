name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Téléchargement et extraction locale (sans sudo, sans wget)
      - name: Install Gitleaks CLI Locally
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xf gitleaks.tar.gz
          chmod +x gitleaks

      # Analyse en ciblant directement le binaire local
      - name: Run Gitleaks Analysis
        run: ./gitleaks detect --verbose --redact || true

  test-backend:
    needs: secrets-scan
    runs-on: self-hosted 
    env:
      APP_ENV: test # Force Symfony à utiliser la configuration de test (.env.test)
    steps:
      - uses: actions/checkout@v4

      # Configurer PHP sur ton runner local
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql
          coverage: none

      # Installer les dépendances via Composer (inclut le test-pack)
      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      # Réinitialiser proprement la base de données de test à chaque passage
      - name: Prepare Database for Tests
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:update --force --env=test

      # Exécuter PHPUnit 
      - name: Run Backend Tests
        run: vendor/bin/phpunit