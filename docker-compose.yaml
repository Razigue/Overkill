services:
  backend:
    build:
      context: ./Overkill_Api
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-overkill_local_development_secret}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-overkill_user}:${POSTGRES_PASSWORD:-overkill_password}@database:5432/${POSTGRES_DB:-overkill}?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-contact@overkill.test}
      CONTACT_SENDER: ${CONTACT_SENDER:-no-reply@overkill.test}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:5173}
    volumes:
      - ./Overkill_Api:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var
    depends_on:
      database:
        condition: service_healthy
    networks:
      - overkill

  frontend:
    build:
      context: ./Overkill_Client
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/backend}
      VITE_N8N_ATS_WEBHOOK_URL: ${VITE_N8N_ATS_WEBHOOK_URL:-http://localhost:5678/webhook/overkill/analyse-cv-ats}
    volumes:
      - ./Overkill_Client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - overkill

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overkill}
      POSTGRES_USER: ${POSTGRES_USER:-overkill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overkill_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB:-overkill} -U $${POSTGRES_USER:-overkill_user}"]
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - overkill

networks:
  overkill:
    driver: bridge

volumes:
  backend_var:
  backend_vendor:
  frontend_node_modules:
  database_data:
