services:
  backend:
    build:
      context: ./Overkill_Api
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in your local .env file}
      DATABASE_URL: ${POSTGRES_REMOTE_URL:?POSTGRES_REMOTE_URL must be set in your local .env file}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-contact@overkill.test}
      CONTACT_SENDER: ${CONTACT_SENDER:-no-reply@overkill.test}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:5173}
    volumes:
      - ./Overkill_Api:/app
      - backend_vendor:/app/vendor
      - backend_var:/app/var
    # depends_on:
    #   database:
    #     condition: service_healthy
    networks:
      - overkill

  frontend:
    build:
      context: ./Overkill_Client
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./Overkill_Client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - overkill

  # database:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_REMOTE_HOST: ${POSTGRES_REMOTE_HOST}
  #     POSTGRES_REMOTE_DB: ${POSTGRES_REMOTE_DB}
  #     POSTGRES_REMOTE_USER: ${POSTGRES_REMOTE_USER}
  #     POSTGRES_REMOTE_PASSWORD: ${POSTGRES_REMOTE_PASSWORD}
  #     POSTGRES_PASSWORD: ${POSTGRES_REMOTE_PASSWORD}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - database_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   networks:
  #     - overkill

networks:
  overkill:
    driver: bridge

volumes:
  backend_var:
  backend_vendor:
  frontend_node_modules:
  database_data:
